<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML 可视化编辑台</title>
  <style data-bundle="workbench">
:root {
  font: 12px/1.5 Geist, Inter, "PingFang SC", system-ui, sans-serif;
  color: #202a29;
  --canvas: #e7ece9;
  --panel: #fcfdfa;
  --line: #e0e6e1;
  --muted: #63736c;
  --ink: #1b3e34;
  --accent: #087c61;
  --tint: #dff3ea;
  --shadow: 0 12px 36px #223c3020;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { width: 100%; height: 100%; margin: 0; }
body { overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: transparent; border: 0; border-radius: 6px; }
button:hover { background: var(--tint); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button:disabled { opacity: .45; cursor: default; }
input {
  min-width: 0;
  padding: 5px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: white;
}
.workbench {
  position: relative;
  isolation: isolate;
  height: 100%;
  --top: 55px;
  --left: 0px;
  --right: 0px;
  background: var(--canvas);
}
.workbench.left-panel-open { --left: 228px; }
.workbench.inspector-open { --right: 276px; }
.topbar {
  position: absolute;
  z-index: 4;
  inset: 0 0 auto;
  height: var(--top);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 10px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.toolbar-cluster, .panel-actions { display: flex; align-items: center; gap: 4px; }
.toolbar-cluster button { min-height: 31px; padding: 0 8px; }
.toolbar-cluster .active { background: var(--tint); color: var(--ink); }
.toolbar-cluster button.primary { background: var(--ink); color: #fff; }
.toolbar-cluster button.primary:hover { background: var(--accent); }
.toolbar-separator { width: 1px; height: 19px; background: var(--line); margin-inline: 2px; }
.toolbar-start { display: flex; align-items: center; gap: 8px; min-width: 0; }
.file-cluster { min-width: 0; }
.file-menu-button { max-width: 100%; }
.file-menu-button, .save-button { display: flex; align-items: center; gap: 8px; min-width: 0; }
.file-menu-button strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.product-mark { color: var(--accent); font-weight: 650; }
.sync-status i { display: block; width: 7px; height: 7px; border-radius: 50%; background: #a2aaa4; }
.sync-status b { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.sync-status[data-state="saved"] i { background: var(--accent); }
.sync-status[data-state="dirty"] i, .sync-status[data-state="saving"] i { background: #c88829; }
.sync-status[data-state="conflict"] i, .sync-status[data-state="error"] i { background: #b83030; }
.file-popover {
  position: absolute;
  top: calc(var(--top) + 8px);
  left: 10px;
  width: min(440px, calc(100% - 20px));
  display: grid;
  gap: 9px;
  padding: 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
}
.file-popover p { margin: 0; color: var(--muted); }
.file-open-row { display: flex; gap: 5px; }
.file-open-row input { flex: 1; }
.file-open-row button { background: var(--tint); }
.workspace-file-list { max-height: 230px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
.workspace-file-list > input { width: calc(100% - 12px); margin: 6px; }
.workspace-file-list label { display: flex; gap: 7px; padding: 6px 8px; align-items: center; }
.workspace-file-list button { margin: 6px; }
.tool-rail { display: flex; gap: 2px; flex: none; }
.tool-rail button { display: flex; align-items: center; gap: 4px; min-height: 31px; padding: 0 6px; }
.tool-rail button[aria-expanded="true"] { background: var(--tint); color: var(--ink); }
.icon-button { display: grid; min-width: 28px; place-items: center; padding: 0; }
svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.control-panel, .inspector-panel {
  position: absolute;
  z-index: 2;
  inset: var(--top) auto 0 0;
  width: 228px;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border-right: 1px solid var(--line);
}
.inspector-panel { inset: var(--top) 0 0 auto; width: 276px; border-right: 0; border-left: 1px solid var(--line); }
.panel-header { display: flex; align-items: center; justify-content: space-between; min-height: 43px; padding: 0 12px; border-bottom: 1px solid var(--line); }
.panel-header button { min-height: 26px; }
.panel-content { flex: 1; min-height: 0; overflow: auto; }
.section-label { color: var(--muted); margin: 10px 12px; }
.layer-toolbar { display: flex; gap: 3px; padding: 8px; }
.layer-toolbar input { width: 100%; flex: 1; }
.layer-toolbar button { flex: none; font-size: 11px; }
.layer-board-title { width: 100%; text-align: left; padding: 6px 8px; font-weight: 650; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer-row { display: flex; min-width: 0; align-items: center; gap: 2px; padding-inline-end: 4px; height: 28px; }
.layer-row:hover { background: #eff6f0; }
.layer-row.selected { background: var(--tint); }
.layer-row.locked { color: var(--muted); }
.layer-disclosure { flex: 0 0 18px; padding: 0; }
.layer-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; padding: 3px; }
.layer-action { flex: none; font-size: 10px; padding: 3px; opacity: 0; }
.layer-row:hover .layer-action, .layer-row:focus-within .layer-action, .layer-row.locked .layer-action, .layer-row.selected .layer-action { opacity: 1; }
.design-group { padding: 10px 12px; border-bottom: 1px solid var(--line); }
.design-group h3 { font-size: 12px; font-weight: 640; margin: 0 0 6px; }
.design-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
.design-field { display: flex; align-items: center; gap: 5px; padding: 0 5px; border: 1px solid var(--line); background: #f4f7f3; border-radius: 6px; min-width: 0; }
.design-field span { color: var(--muted); white-space: nowrap; }
.design-field input { width: 100%; min-width: 0; border: 0; padding-inline: 2px; background: transparent; }
.font-picker, .attributes-panel { padding: 8px 12px; border-bottom: 1px solid var(--line); }
.font-input-row { display: flex; gap: 4px; margin-top: 4px; }
.font-input-row input { flex: 1; width: 100%; }
.font-input-row button { flex: none; }
.attributes-panel label { display: grid; margin-bottom: 5px; gap: 3px; }
#context-button { margin: 8px 12px; padding: 5px 9px; background: var(--tint); }
#blocks-panel { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 5px; padding: 10px; }
#blocks-panel button { border: 1px solid var(--line); min-height: 43px; }
.canvas-area { position: absolute; inset: var(--top) var(--right) 0 var(--left); overflow: clip; touch-action: none; }
.canvas-stage { position: absolute; inset: 0; transform-origin: top left; }
.board-card { position: absolute; }
.board-title { display: flex; align-items: center; justify-content: space-between; height: 30px; padding: 0 4px; color: var(--muted); cursor: grab; user-select: none; }
.board-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
.board-title button { font-size: 16px; min-width: 22px; }
.board-card.active .board-title { color: var(--accent); }
.board-card.active .board-surface { outline: 2px solid var(--accent); }
.board-surface { position: relative; overflow: hidden; height: 660px; background: white; box-shadow: 0 4px 14px #15342618; }
.board-surface iframe, .board-overlay { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; }
.board-overlay { pointer-events: none; overflow: hidden; }
.selection-outline { position: absolute; outline: 2px solid var(--accent); outline-offset: -1px; }
.hover-outline { position: absolute; border: calc(1px * var(--guide-scale, 1)) solid var(--accent); }
#canvas-marquee { position: absolute; pointer-events: none; border: 1px solid var(--accent); background: #087c6122; }
.context-toast { position: absolute; z-index: 5; left: 12px; bottom: 12px; max-width: calc(100% - 24px); padding: 8px 12px; color: #fff; background: var(--ink); border-radius: 8px; box-shadow: var(--shadow); }
.context-toast[data-state="error"] { background: #a63c37; }
.workbench[data-mode="preview"] { --left: 0px; --right: 0px; }
.workbench[data-mode="preview"] :is(.control-panel, .inspector-panel, .tool-rail, .edit-action) { display: none; }
@media (max-width: 900px) {
  .workbench.left-panel-open { --left: 176px; }
  .workbench.inspector-open { --right: 226px; }
  .control-panel { width: 176px; }
  .inspector-panel { width: 226px; }
}
@media (max-width: 680px) {
  .workbench.left-panel-open, .workbench.inspector-open { --left: 0px; --right: 0px; }
  .toolbar-cluster [data-width]:not([data-width="full"]), .save-button span, .product-mark, #replace-image-button { display: none; }
  .control-panel, .inspector-panel { box-shadow: var(--shadow); max-width: 65%; }
  .tool-rail span { display: none; }
}
.effect-header, .effect-item { display: flex; align-items: center; gap: 4px; }
.effect-header { justify-content: space-between; }
.effect-header h3 { margin: 0; }
.effect-header button { min-width: 25px; }
.effect-item { padding-top: 5px; }
.effect-item > button:first-child { flex: 1; text-align: left; }
.effect-options { display: grid; gap: 5px; margin-top: 5px; padding: 7px; border: 1px solid var(--line); border-radius: 8px; background: white; }
.effect-options select { padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: white; font: inherit; }
.icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.layer-row button > svg { display: block; width: 13px; height: 13px; margin: auto; }
#context-button { display: flex; align-items: center; gap: 5px; }
.board-title span { transform: scale(var(--title-scale, 1)); transform-origin: left center; max-width: calc((100% - 32px) / var(--title-scale, 1)); }
.board-title button { transform: scale(var(--title-scale, 1)); transform-origin: right center; }
.canvas-area[data-panning="true"], .canvas-area[data-panning="true"] .board-title { cursor: grab; }
.canvas-area[data-panning="true"] .board-edit { pointer-events: none; }
.token-panel { border-bottom: 1px solid var(--line); padding: 3px 8px 8px; }
.token-create, .token-row { display: grid; gap: 4px; align-items: center; }
.token-create { grid-template-columns: minmax(0, 1fr) 79px auto; }
.token-create button, .dialog-actions button:last-child { background: var(--tint); min-height: 27px; }
.token-row { grid-template-columns: minmax(0, 1fr) auto; margin-top: 7px; }
.token-row strong { grid-column: 1 / -1; overflow-wrap: anywhere; font-weight: 600; }
.token-row button { min-height: 26px; }
.color-input { display: flex; flex: 1; align-items: center; gap: 4px; min-width: 0; }
.color-input input { min-width: 0; width: 100%; }
.color-input .color-swatch {
  flex: 0 0 24px;
  width: 24px;
  height: 24px;
  padding: 3px;
  border: 0;
  background: transparent;
  cursor: pointer;
}
.color-swatch::-webkit-color-swatch-wrapper { padding: 0; }
.color-swatch::-webkit-color-swatch { border: 1px solid var(--line); border-radius: 4px; }
.color-swatch::-moz-color-swatch { border: 1px solid var(--line); border-radius: 4px; }
.color-field { grid-column: 1 / -1; }
.token-select { min-width: 70px; width: 105px; color: var(--ink); border: 1px solid var(--line); border-radius: 5px; background: white; font: inherit; }
:is(.token-dialog, .version-dialog) { width: min(460px, calc(100% - 30px)); max-height: 85vh; padding: 16px; color: inherit; border: 1px solid var(--line); border-radius: 10px; }
:is(.token-dialog, .version-dialog)::backdrop { background: #17312d50; }
:is(.token-dialog, .version-dialog) h2 { font-size: 15px; margin: 0; }
.version-dialog p { margin: 6px 0; color: var(--muted); overflow-wrap: anywhere; }
.version-list { max-height: 28vh; overflow: auto; }
.version-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 34px; border-bottom: 1px solid var(--line); }
.version-row span { color: var(--muted); }
.version-preview { display: block; width: 100%; height: min(36vh, 320px); border: 1px solid var(--line); margin-top: 8px; }
.usage-list { max-height: 50vh; overflow: auto; }
.usage-list label { display: flex; align-items: center; gap: 6px; padding: 6px; border-bottom: 1px solid var(--line); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
#font-variant-label { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px; align-items: center; margin-top: 6px; }
#font-variant { width: 100%; padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: white; color: inherit; font: inherit; }
#save-conflict { position: absolute; z-index: 3; top: calc(var(--top) + 8px); left: calc(var(--left) + 10px); right: calc(var(--right) + 10px); display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding: 6px 8px; border: 1px solid #dab99b; border-radius: 6px; background: #fff4e8; }
#save-conflict span { flex: 1; min-width: 150px; }
#save-conflict button { padding: 4px 7px; background: #fae6d4; }

@media (max-width: 460px) {
  .workbench { --top: 86px; }
  .topbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 4px; padding: 4px 6px; }
  .viewport-controls { grid-area: 2 / 1 / 3 / -1; justify-content: center; }
  .toolbar-start { grid-area: 1 / 1; gap: 4px; }
  .actions { grid-area: 1 / 2; }
}
.alignment-controls { display: flex; gap: 3px; margin-bottom: 6px; }
.alignment-controls button { flex: 1; min-width: 0; min-height: 27px; background: #f0f5f1; }
.alignment-controls button:hover { background: var(--tint); }
.alignment-guide, .distance-line { position: absolute; z-index: 1; --guide-color: #cb4268; --line-width: calc(1px * var(--guide-scale, 1)); background: var(--guide-color); }
.alignment-guide.horizontal, .distance-line.horizontal { width: var(--hint-length); height: var(--line-width); }
.alignment-guide.vertical, .distance-line.vertical { width: var(--line-width); height: var(--hint-length); }
.distance-line { --guide-color: #a72b55; }
.distance-line span { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(var(--guide-scale, 1)); padding: 1px 4px; border-radius: 3px; background: var(--guide-color); color: white; font: 600 10px/1.5 system-ui, sans-serif; white-space: nowrap; }
.distance-line.horizontal span { margin-top: calc(-9px * var(--guide-scale, 1)); }
.distance-line.vertical span { margin-left: calc(17px * var(--guide-scale, 1)); }
.inspector-panel .panel-content { overflow-anchor: none; }

</style>
</head>

  <main class="workbench" data-html-workbench="true">
    <header class="topbar" aria-label="编辑器工具栏">
      <div class="toolbar-start">
        <div class="toolbar-cluster file-cluster">
          <button id="file-menu-button" class="file-menu-button" type="button" aria-expanded="false">
            <span class="product-mark">HTML</span>
            <strong id="file-name">未打开文件</strong>
            <span id="status" class="sync-status" data-state="idle"><i></i><b>等待打开文件</b></span>
            <svg aria-hidden="true"><use href="#wb-chevron-down"></use></svg>
