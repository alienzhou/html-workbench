  <main class="workbench" data-html-workbench="true">
    <header class="topbar" aria-label="编辑器工具栏">
      <div class="toolbar-start">
        <div class="toolbar-cluster file-cluster">
          <button id="file-menu-button" class="file-menu-button" type="button" aria-expanded="false">
            <span class="product-mark">HTML</span>
            <strong id="file-name">未打开文件</strong>
            <span id="status" class="sync-status" data-state="idle"><i></i><b>等待打开文件</b></span>
            <svg aria-hidden="true"><use href="#wb-chevron-down"></use></svg>
          </button>
          <div id="file-popover" class="file-popover" hidden>
            <label for="directory-input">工作目录</label>
            <div class="file-open-row">
              <input id="directory-input" aria-label="工作目录绝对路径" placeholder="/absolute/path/project">
              <button id="browse-button" type="button">读取目录</button>
            </div>
            <div id="file-list" class="workspace-file-list" hidden></div>
            <label for="file-input">本地 HTML 文件</label>
            <div class="file-open-row">
              <input id="file-input" aria-label="HTML 文件绝对路径" placeholder="/absolute/path/page.html">
              <button id="open-button" type="button">打开</button>
            </div>
            <p>输入绝对路径，工作台会直接读取并同步保存。</p>
          </div>
        </div>
        <nav class="tool-rail" aria-label="编辑工具">
          <button type="button" data-panel="blocks" aria-controls="control-panel" aria-expanded="false" aria-label="添加内容" title="添加内容">
            <svg aria-hidden="true"><use href="#wb-plus"></use></svg>
            <span>添加</span>
          </button>
          <button type="button" data-panel="styles" aria-controls="inspector-panel" aria-expanded="false" aria-label="调整样式" title="调整样式">
            <svg aria-hidden="true"><use href="#wb-sliders-horizontal"></use></svg>
            <span>样式</span>
          </button>
          <button type="button" data-panel="layers" aria-controls="control-panel" aria-expanded="false" aria-label="图层" title="图层">
            <svg aria-hidden="true"><use href="#wb-layers"></use></svg>
            <span>图层</span>
          </button>
        </nav>
      </div>

      <div class="toolbar-cluster viewport-controls" aria-label="工作台模式和画布尺寸">
        <button type="button" data-mode="edit" class="mode-button active" aria-pressed="true">编辑</button>
        <button type="button" data-mode="preview" class="mode-button" aria-pressed="false">预览</button>
        <span class="toolbar-separator" aria-hidden="true"></span>
        <button id="focus-board-button" type="button" title="回到当前页面">回到页面</button>
        <button id="fit-button" class="fit-button active" type="button" aria-pressed="true">适应</button>
        <button type="button" data-width="375">375</button>
        <button type="button" data-width="768" class="active">768</button>
        <button type="button" data-width="1280">1280</button>
        <button type="button" data-width="full" title="使用画布可用宽度">全屏</button>
      </div>

      <div class="toolbar-cluster actions">
        <button id="undo-button" class="icon-button edit-action" type="button" aria-label="撤销" title="撤销">
          <svg aria-hidden="true"><use href="#wb-undo-2"></use></svg>
        </button>
        <button id="redo-button" class="icon-button edit-action" type="button" aria-label="重做" title="重做">
          <svg aria-hidden="true"><use href="#wb-redo-2"></use></svg>
        </button>
        <button id="replace-image-button" class="icon-button edit-action" type="button" aria-label="替换图片" title="替换图片">
          <svg aria-hidden="true"><use href="#wb-image"></use></svg>
        </button>
        <button id="versions-button" class="edit-action" type="button" title="历史版本">版本</button>
        <button id="save-button" class="primary save-button edit-action" type="button" aria-label="保存" title="保存">
          <svg aria-hidden="true"><use href="#wb-save"></use></svg>
          <span>保存</span>
        </button>
      </div>
    </header>


    <aside id="control-panel" class="control-panel" hidden>
      <header class="panel-header">
        <div><strong id="panel-title">添加内容</strong></div>
        <div class="panel-actions">
          <button id="pin-panel-button" class="icon-button" type="button" aria-label="固定面板" aria-pressed="false" title="固定面板">
            <svg aria-hidden="true"><use href="#wb-pin"></use></svg>
          </button>
          <button id="close-panel-button" class="icon-button" type="button" aria-label="关闭面板" title="关闭面板">
            <svg aria-hidden="true"><use href="#wb-x"></use></svg>
          </button>
        </div>
      </header>
      <section class="panel-content" data-panel-content="blocks">

        <div id="blocks-panel"></div>
      </section>
      <section class="panel-content" data-panel-content="layers" hidden>
        <div class="layer-toolbar"><input id="layer-search" aria-label="搜索图层" placeholder="搜索图层"><button id="token-button" type="button">颜色 Token</button></div>
        <div id="token-panel" class="token-panel" hidden></div>
        <div id="layer-tree" class="layer-tree"></div>
      </section>
    </aside>

    <aside id="inspector-panel" class="inspector-panel" hidden>
      <header class="panel-header"><strong>设计</strong><button id="close-inspector-button" class="icon-button" type="button" aria-label="关闭设计面板"><svg aria-hidden="true"><use href="#wb-x"></use></svg></button></header>
      <section class="panel-content" data-panel-content="styles">
        <p class="section-label">所选元素</p>
        <section class="font-picker"><label for="font-family-input">字体家族</label><div class="font-input-row"><input id="font-family-input" list="font-options" placeholder="输入字体名称"><button id="font-load-button" type="button">读取本地字体</button></div><datalist id="font-options"></datalist><label id="font-variant-label" hidden>字体样式<select id="font-variant" aria-label="字体样式"></select></label></section>
        <div id="styles-panel"></div>
        <div id="effects-panel"></div>
        <section id="attributes-panel" class="attributes-panel" hidden>
          <label>图片地址<input id="src-input"></label>
          <label>替代文本<input id="alt-input"></label>
          <label>链接地址<input id="href-input"></label>
        </section>
        <button id="context-button" type="button" title="添加到对话上下文" aria-label="将选中元素添加到对话上下文"><svg aria-hidden="true"><use href="#wb-message-square-plus"></use></svg>添加到对话上下文</button>
      </section>
    </aside>

    <section class="canvas-area">
      <div id="canvas-stage" class="canvas-stage">
        <div id="board-strip" class="board-strip"></div>
      </div>
      <div id="canvas-marquee" hidden></div>
    </section>

    <div id="save-conflict" role="status" hidden></div>
    <output id="context-toast" class="context-toast" hidden aria-live="polite"></output>
  </main>
  <script type="module" src="/workbench.js"></script>
</body>
</html>
